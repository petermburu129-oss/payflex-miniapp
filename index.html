<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>PayFlex - Earn Money</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <div class="header">
            <h1>💰 PayFlex</h1>
            <p class="subtitle">Earn money by completing tasks</p>
        </div>

        <!-- Balance Card -->
        <div class="balance-card">
            <div class="balance-amount">
                <span class="balance-label">Balance</span>
                <h2 id="balance">$0.00</h2>
            </div>
            <div class="stats-grid">
                <div class="stat-item">
                    <span class="stat-value" id="adsWatched">0</span>
                    <span class="stat-label">Ads Watched</span>
                </div>
                <div class="stat-item">
                    <span class="stat-value" id="referralCount">0</span>
                    <span class="stat-label">Referrals</span>
                </div>
            </div>
            <!-- Progress Bar -->
            <div class="progress-container">
                <div class="progress-bar">
                    <div class="progress-fill" id="withdrawalProgress" style="width: 0%"></div>
                </div>
                <span class="progress-text" id="progressText">$0.00 / $5.00</span>
            </div>
        </div>

        <!-- Quick Actions -->
        <div class="quick-actions">
            <button class="action-btn watch-ad-btn" id="watchAdBtn">
                <span class="btn-icon">📺</span>
                Watch Ad ($0.05)
            </button>
            <button class="action-btn withdraw-btn" id="withdrawBtn">
                <span class="btn-icon">💸</span>
                Withdraw
            </button>
        </div>

        <!-- Daily Tasks -->
        <div class="tasks-section">
            <h3>📋 Daily Tasks ($0.10 each)</h3>
            <div class="tasks-list" id="tasksList">
                <!-- Tasks will be generated by JavaScript -->
            </div>
        </div>

        <!-- Bottom Navigation -->
        <div class="bottom-nav">
            <button class="nav-btn active" onclick="showTab('tasks')">
                <span>📋</span> Tasks
            </button>
            <button class="nav-btn" onclick="showTab('invite')">
                <span>👥</span> Invite
            </button>
            <button class="nav-btn" onclick="showTab('more')">
                <span>⚙️</span> More
            </button>
        </div>
    </div>

    <!-- Invite Modal -->
    <div class="modal" id="inviteModal">
        <div class="modal-content">
            <h3>👥 Invite Friends</h3>
            <p>Earn $0.50 per referral!</p>
            <div class="referral-link-container">
                <input type="text" id="referralLink" readonly>
                <button onclick="copyReferralLink()">Copy Link</button>
            </div>
            <p class="referral-info">Your referrals: <span id="referralCountModal">0</span></p>
            <button class="close-btn" onclick="closeModal('inviteModal')">Close</button>
        </div>
    </div>

    <!-- Withdrawal Modal -->
    <div class="modal" id="withdrawalModal">
        <div class="modal-content">
            <h3>💸 Withdraw Funds</h3>
            <p>Minimum withdrawal: $5.00</p>
            <form id="withdrawalForm">
                <select id="withdrawalMethod" required>
                    <option value="">Select method</option>
                    <option value="mpesa">M-Pesa</option>
                    <option value="paypal">PayPal</option>
                    <option value="paxum">Paxum</option>
                    <option value="pioneer">Pioneer</option>
                    <option value="binance">Binance</option>
                    <option value="webmoney">WebMoney</option>
                </select>
                <input type="text" id="accountDetails" placeholder="Account details" required>
                <input type="number" id="amount" placeholder="Amount (min $5.00)" step="0.01" min="5" required>
                <button type="submit">Request Withdrawal</button>
            </form>
            <button class="close-btn" onclick="closeModal('withdrawalModal')">Cancel</button>
        </div>
    </div>

    <!-- More Options Modal -->
    <div class="modal" id="moreModal">
        <div class="modal-content">
            <h3>⚙️ More Options</h3>
            <div class="more-options">
                <button onclick="window.open('https://t.me/+TCJNKW2sFFc2YWY0', '_blank')">
                    📢 Join Channel
                </button>
                <button onclick="window.open('https://www.youtube.com/@hummingbirdtvke2255', '_blank')">
                    ▶️ YouTube Channel
                </button>
                <button onclick="showTab('invite')">
                    👥 Invite Friends
                </button>
                <button onclick="showWithdrawalHistory()">
                    📊 History
                </button>
            </div>
            <button class="close-btn" onclick="closeModal('moreModal')">Close</button>
        </div>
    </div>

    <script src="firebase-config.js"></script>
    <script src="app.js"></script>
</body>
</html>
